# Fly.io configuration for the Payload CMS application.
# Deploy with: fly deploy --config fly.cms.toml

app = 'medrevue-cms'
primary_region = 'syd'
swap_size_mb = 512

[build]
  dockerfile = 'packages/cms/Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/admin'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
